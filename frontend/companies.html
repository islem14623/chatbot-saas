<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Companies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>🏢 My Chatbots</h1>
</header>

<main class="container">

  <section class="card form-card">
    <h2>➕ Create New Chatbot</h2>
    <input type="text" id="name" placeholder="Company Name">
    <input type="text" id="description" placeholder="Short description">
    <textarea id="prompt" placeholder="AI instructions (system prompt)"></textarea>
    <button onclick="createCompany()">Create Chatbot</button>
  </section>

  <section>
    <h2>📋 Your Chatbots</h2>
    <div id="companies-list" class="grid">Loading...</div>
  </section>

</main>

<script src="companies.js"></script>
</body>
</html>
