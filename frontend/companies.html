<!DOCTYPE html>
<html>
<head>
    <title>My Companies</title>
</head>
<body>
    <h1>🏢 My Companies</h1>

    <h2>➕ Create New Company</h2>
    <input type="text" id="name" placeholder="Company Name"><br>
    <input type="text" id="description" placeholder="Description"><br>
    <textarea id="prompt" placeholder="AI instructions (system prompt)"></textarea><br>
    <button onclick="createCompany()">Create</button>

    <hr>
    <h2>📋 Existing Companies</h2>
    <div id="companies-list">Loading...</div>

    <script>
        const API = 'http://localhost:5000';
        const token = localStorage.getItem('token');

        async function createCompany() {
            const name = document.getElementById('name').value;
            const description = document.getElementById('description').value;
            const system_prompt = document.getElementById('prompt').value;

            const res = await fetch(`${API}/api/companies/?token=${token}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description, system_prompt })
            });

            if (res.ok) {
                alert('Company created!');
                loadCompanies();
            } else {
                alert('Error creating company');
            }
        }

        async function loadCompanies() {
            const res = await fetch(`${API}/api/companies/?token=${token}`);
            const data = await res.json();

            const list = document.getElementById('companies-list');
           list.innerHTML = data.companies.map(c =>
           `<p><b>${c.name}</b> - ${c.description} (ID: ${c.id})</p>`
            ).join('');

        loadCompanies(); 
    }
    </script>
</body>
</html>
