<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot SaaS - Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f5f5f5;
            height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #667eea;
        }

        .new-chat-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            width: 100%;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 13px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: #667eea;
            color: white;
        }

        .logout-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .input-area {
            background: white;
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .send-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .send-btn:hover { opacity: 0.9; }

        .welcome {
            text-align: center;
            color: #888;
            margin: auto;
        }

        .welcome h2 { margin-bottom: 10px; }

        .typing {
            color: #888;
            font-style: italic;
            font-size: 13px;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">🤖 ChatBot SaaS</div>
        <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
        <div class="conversation-list" id="conversation-list"></div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
        <div class="chat-header" id="chat-header">
            Select a conversation or start a new chat
        </div>

        <div class="messages" id="messages">
            <div class="welcome">
                <h2>👋 Welcome!</h2>
                <p>Start a new chat or select an existing conversation</p>
            </div>
        </div>

        <p class="typing" id="typing" style="display:none">AI is typing...</p>

        <div class="input-area">
            <input
                type="text"
                id="message-input"
                placeholder="Type your message..."
                onkeypress="if(event.key==='Enter') sendMessage()"
            >
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const API = 'https://chatbot-backend-kbpn.onrender.com';
        const token = localStorage.getItem('token');
        let currentConversationId = null;

        // Redirect to login if no token
        if (!token) window.location.href = 'index.html';

        // Load conversations on page load
        loadConversations();

        async function loadConversations() {
            try {
                const res = await fetch(`${API}/api/chat/conversations?token=${token}`);
                const data = await res.json();

                const list = document.getElementById('conversation-list');
                list.innerHTML = '';

                data.conversations.forEach(conv => {
                    const item = document.createElement('div');
                    item.className = 'conversation-item';
                    item.textContent = conv.title;
                    item.onclick = () => loadMessages(conv.id, conv.title);
                    list.appendChild(item);
                });
            } catch (err) {
                console.error('Error loading conversations');
            }
        }

        async function loadMessages(conversationId, title) {
            currentConversationId = conversationId;

            // Update header
            document.getElementById('chat-header').textContent = title;

            // Update active conversation
            document.querySelectorAll('.conversation-item').forEach(i => i.classList.remove('active'));
            event.target.classList.add('active');

            try {
                const res = await fetch(
                    `${API}/api/chat/conversations/${conversationId}/messages?token=${token}`
                );
                const data = await res.json();

                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';

                data.messages.forEach(msg => {
                    addMessageToUI(msg.role, msg.content);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Error loading messages');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (!message) return;

            // Show user message immediately
            addMessageToUI('user', message);
            input.value = '';
            scrollToBottom();

            // Show typing indicator
            document.getElementById('typing').style.display = 'block';

            try {
                const res = await fetch(`${API}/api/chat/chat?token=${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        conversation_id: currentConversationId
                    })
                });

                const data = await res.json();

                // Hide typing indicator
                document.getElementById('typing').style.display = 'none';

                // Show AI response
                addMessageToUI('assistant', data.ai_response);

                // Update conversation id
                currentConversationId = data.conversation_id;

                // Reload conversations list
                loadConversations();
                scrollToBottom();

            } catch (err) {
                document.getElementById('typing').style.display = 'none';
                addMessageToUI('assistant', 'Error: Could not connect to server!');
            }
        }

        function addMessageToUI(role, content) {
            const messagesDiv = document.getElementById('messages');
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.textContent = content;
            messagesDiv.appendChild(msg);
        }

        function newChat() {
            currentConversationId = null;
            document.getElementById('messages').innerHTML = `
                <div class="welcome">
                    <h2>👋 New Chat</h2>
                    <p>Type your message to start!</p>
                </div>
            `;
            document.getElementById('chat-header').textContent = 'New Chat';
            document.querySelectorAll('.conversation-item').forEach(i => i.classList.remove('active'));
        }

        function scrollToBottom() {
            const messages = document.getElementById('messages');
            messages.scrollTop = messages.scrollHeight;
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
