services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: islem
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
